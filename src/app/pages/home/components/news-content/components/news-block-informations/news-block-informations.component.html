<section class="h-100 trasition-all" [style.backgroundImage]="'url(' + data.image + ')'">
  <div class="p-1 text-content">
    <app-news-block-overlay [text]="data.title" [maxTitle]="maxTitleLength"></app-news-block-overlay>

  </div>
</section>
